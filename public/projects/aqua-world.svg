      <circle cx="16" cy="16" r="5" fill="#10b981"/>
      <text x="32" y="20" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="500">Stock Summary &amp; Consolidated Report</text>
      <text x="315" y="20" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">PASSED</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(20, 88)">
      <rect x="0" y="0" width="370" height="32" rx="6" fill="#1e293b" fill-opacity="0.5"/>
      <circle cx="16" cy="16" r="5" fill="#10b981"/>
      <text x="32" y="20" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="500">Stock Transfer &amp; In-Transit Validation</text>
      <text x="315" y="20" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">PASSED</text>
    </g>

    <!-- Row 3 -->
    <g transform="translate(20, 128)">
      <rect x="0" y="0" width="370" height="32" rx="6" fill="#1e293b" fill-opacity="0.5"/>
      <circle cx="16" cy="16" r="5" fill="#10b981"/>
      <text x="32" y="20" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="500">Min. Stock Alert &amp; Calculation Accuracy</text>
      <text x="315" y="20" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">PASSED</text>
    </g>

    <!-- Row 4 -->
    <g transform="translate(20, 168)">
      <rect x="0" y="0" width="370" height="32" rx="6" fill="#1e293b" fill-opacity="0.5"/>
      <circle cx="16" cy="16" r="5" fill="#10b981"/>
      <text x="32" y="20" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="500">Packing &amp; Unit Conversion Workflows</text>
      <text x="315" y="20" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">PASSED</text>
    </g>
  </g>

  <!-- Right Chart Panel -->
  <g transform="translate(495, 180)">
    <rect x="0" y="0" width="240" height="210" rx="8" fill="#0f172a" fill-opacity="0.8" stroke="#1e293b" stroke-width="1"/>
    <text x="18" y="28" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700">Test Execution Breakdown</text>

    <!-- Bar 1 -->
    <text x="18" y="60" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10.5">Functional Tests (100%)</text>
    <rect x="18" y="68" width="200" height="10" rx="5" fill="#1e293b"/>
    <rect x="18" y="68" width="200" height="10" rx="5" fill="url(#passGrad)"/>

    <!-- Bar 2 -->
    <text x="18" y="102" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10.5">Regression Testing (94%)</text>
    <rect x="18" y="110" width="200" height="10" rx="5" fill="#1e293b"/>
    <rect x="18" y="110" width="188" height="10" rx="5" fill="url(#accentGrad)"/>

    <!-- Bar 3 -->
    <text x="18" y="144" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10.5">Boundary Value Analysis (96%)</text>
    <rect x="18" y="152" width="200" height="10" rx="5" fill="#1e293b"/>
    <rect x="18" y="152" width="192" height="10" rx="5" fill="#38bdf8"/>

    <text x="18" y="188" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="10">Branch-wise Multi-Location Sync Verified</text>
  </g>
</svg>
